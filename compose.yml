services:
  
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    image: frontend
    container_name: frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
  
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    image: backend
    container_name: backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/code/app
    ports:
      - "8000:8000"
  
    